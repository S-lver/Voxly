{% extends "base.html" %}

{% block title %}Dashboard - EduCall AI{% endblock %}

{% block content %}
<div class="dashboard-header">
    <h1>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline; vertical-align:middle;">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Dashboard
    </h1>
</div>

<div class="stats-grid" id="stats">
    <div class="stat-card">
        <div class="stat-label">Total Calls</div>
        <div class="stat-value" id="total-calls">-</div>
    </div>
    <div class="stat-card" style="border-left-color: var(--success);">
        <div class="stat-label">Resolved</div>
        <div class="stat-value" id="resolved">-</div>
    </div>
    <div class="stat-card" style="border-left-color: var(--danger);">
        <div class="stat-label">Unresolved</div>
        <div class="stat-value" id="unresolved">-</div>
    </div>
    <div class="stat-card" style="border-left-color: var(--warning);">
        <div class="stat-label">Resolution Rate</div>
        <div class="stat-value" id="resolution-rate">-</div>
    </div>
</div>

<div class="quick-actions">
    <a href="/upload" class="quick-action-btn">
        <span class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
        </span>
        Upload Students
    </a>
    <a href="/call" class="quick-action-btn">
        <span class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
        </span>
        Start Call
    </a>
    <a href="/logs" class="quick-action-btn">
        <span class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
        </span>
        Call Logs
    </a>
</div>

<script>
async function loadStats() {
    try {
        const response = await fetch('/api/stats');
        const data = await response.json();
        document.getElementById('total-calls').textContent = data.total_calls;
        document.getElementById('resolved').textContent = data.resolved;
        document.getElementById('unresolved').textContent = data.unresolved;
        document.getElementById('resolution-rate').textContent = data.resolution_rate;
    } catch (error) {
        console.error('Error loading stats:', error);
    }
}

loadStats();
setInterval(loadStats, 10000);
</script>
{% endblock %}
